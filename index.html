<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="description" content="An interactive 3D FPS experience with dynamic point clouds">
    <title>Mental Furniture FPS</title>
    <style>
        * { margin: 0; padding: 0; }
        body { 
            margin: 0; 
            overflow: hidden;
            background: #000;
        }
        canvas { 
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #gameContainer { 
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            z-index: 1000;
        }
        #mobileControls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
        }
        #joystick {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
        }
        #moving-poem {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 60vh;
            width: auto;
            max-width: 70vw;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: difference;
        }
        @media (max-aspect-ratio: 148/210) {
            #moving-poem {
                width: 70vw;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="game"></canvas>
        <div id="crosshair">+</div>
        <div id="mobileControls">
            <div id="joystick"></div>
        </div>
    </div>

    <object id="moving-poem" type="image/svg+xml" data="moving-poem-light.svg"></object>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM fully loaded');
            // Load the game script after everything else is ready
            const gameScript = document.createElement('script');
            gameScript.src = 'fps_game.js';
            gameScript.onload = function() {
                console.log('Game script loaded');
            };
            gameScript.onerror = function(error) {
                console.error('Error loading game script:', error);
            };
            document.body.appendChild(gameScript);
        });
    </script>
</body>
</html>
